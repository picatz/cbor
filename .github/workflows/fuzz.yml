name: Fuzz
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Duration per fuzz target
        default: 10m
permissions:
  contents: read

# Longer fuzzing than the per-push smoke runs. A failing input is uploaded
# as an artifact; check it in under testdata/fuzz to keep it as a seed.
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dir: ., target: FuzzDecode}
          - {dir: ., target: FuzzRoundTrip}
          - {dir: ., target: FuzzStream}
          - {dir: ., target: FuzzShortestFloat}
          - {dir: ., target: FuzzDiagnose}
          - {dir: ., target: FuzzSchema}
          - {dir: ., target: FuzzCOSE}
          - {dir: ., target: FuzzDeferral}
          - {dir: ., target: FuzzBytewiseMatchesCTAP2}
          - {dir: interop, target: FuzzDifferential}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: interop/go.sum
      - name: Fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.dir }}
        env:
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}
        run: go test -run '^$' -fuzz "^${{ matrix.target }}\$" -fuzztime "$FUZZTIME" .
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crasher-${{ matrix.target }}
          path: ${{ matrix.dir }}/testdata/fuzz/${{ matrix.target }}
